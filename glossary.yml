- term: offline guessing attack
  term_zh: 离线猜测攻击
  pinyin: li
  brief: Guessing a master password from data the adversary already holds, without touching the live service,
    so rate limits do not apply.
  brief_zh: 仅凭已到手的数据猜测主密码，不接触在线服务，故不受速率限制约束。
  detail: Duan et al. split these into four types by adversary knowledge and find 38 of 43 managers vulnerable
    to at least one, showing single-master-password designs lean on slow hashing and password entropy.
  detail_zh: Duan 等按对手掌握的信息把它们分为四类，发现 43 款管理器里有 38 款无法抵御至少一类，说明单一主密码设计依赖慢哈希与密码熵。
