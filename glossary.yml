- term: roll-back attack
  term_zh: 回滚攻击
  pinyin: hui
  brief: Replaying an older, validly signed or encrypted vault version to undo changes or revive revoked
    access.
  brief_zh: 重放较早且签名或加密均合法的保险库版本，以撤销改动或恢复已收回的权限。
  detail: The paper finds that Merkle-tree authentication blocks selective deletion but cannot rule out
    complete roll-back without a trusted third party holding versioning information or local cryptographic
    state.
  detail_zh: 论文发现 Merkle 树认证能挡住选择性删除，但若无可信第三方持有版本信息或本地密码学状态，完整的回滚无法排除。
