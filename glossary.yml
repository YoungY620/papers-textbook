- term: Verified Key Directory
  term_zh: 验证密钥目录
  pinyin: yan
  brief: A directory that makes a provider's mis-association of public keys evident to users.
  brief_zh: 让服务商错误关联公钥的行为对用户可见的目录机制。
  detail: Explored in secure messaging, it would not stop a malicious server from binding the wrong public
